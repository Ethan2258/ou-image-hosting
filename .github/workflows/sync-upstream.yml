name: Sync upstream

# Merges cshaizhihao/ou-image-hosting main into this fork and starts a
# release when anything new came in. When the merge conflicts, or it touches
# workflow files the default token may not push, an issue lists what needs a
# manual merge and the run fails so the owner gets notified. (A pull request
# straight from the upstream fork is refused by GitHub: "Fork collab can't be
# granted by someone without permission".)
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: cshaizhihao/ou-image-hosting

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main
          upstream_sha="$(git rev-parse --short upstream/main)"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already contains upstream ${upstream_sha}."
            echo "result=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"
          if ! git merge --no-edit -m "chore: merge upstream ${upstream_sha}" upstream/main; then
            git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/' > "$RUNNER_TEMP/conflicts.md"
            {
              echo "### 上游合并冲突"
              echo
              cat "$RUNNER_TEMP/conflicts.md"
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git push origin HEAD:main; then
            echo "Merged upstream ${upstream_sha}." >> "$GITHUB_STEP_SUMMARY"
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            echo "推送被拒绝（上游修改了工作流文件时需要带 workflow 权限的 SYNC_TOKEN）。" >> "$GITHUB_STEP_SUMMARY"
            echo "result=push-rejected" >> "$GITHUB_OUTPUT"
          fi

      - name: Start release
        if: steps.merge.outputs.result == 'merged'
        env:
          GH_TOKEN: ${{ github.token }}
        # The checkout has an upstream remote, which gh prefers as its default
        # repository, so the target must be named explicitly.
        run: gh workflow run release.yml --ref main --repo "$GITHUB_REPOSITORY"

      - name: Report a manual merge
        if: steps.merge.outputs.result == 'conflict' || steps.merge.outputs.result == 'push-rejected'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.merge.outputs.result }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="同步上游需要手动合并"
          {
            if [[ "$RESULT" == conflict ]]; then
              echo "自动同步无法直接合并上游 \`${UPSTREAM_REPOSITORY}\` 的 main（\`${UPSTREAM_SHA}\`），以下文件有冲突："
              echo
              cat "$RUNNER_TEMP/conflicts.md"
            else
              echo "上游 \`${UPSTREAM_SHA}\` 修改了工作流文件，默认令牌不能推送。配置带 workflow 权限的 \`SYNC_TOKEN\`，或手动合并。"
            fi
            echo
            echo "本地处理：\`git fetch https://github.com/${UPSTREAM_REPOSITORY}.git main && git merge FETCH_HEAD\`，解决后走 PR 合并。"
            echo
            echo "运行记录：${RUN_URL}"
          } > "$RUNNER_TEMP/issue.md"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi
          echo "需要手动合并上游，见 issue「${title}」。" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # GitHub disables scheduled workflows after 60 days without repository
      # activity, and upstream can stay quiet for months. Re-enabling this
      # workflow on every run resets that timer so syncing never stops silently.
      - name: Keep the schedule alive
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/sync-upstream.yml/enable"
